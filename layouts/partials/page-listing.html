{{ $pages := . }}
{{ if gt (len $pages) 0 }}
<div class="grid gap-3 sm:grid-cols-2 mt-4">
  {{ range $pages }}
  {{ $hasChildren := gt (len .Pages) 0 }}
  <a href="{{ .RelPermalink }}"
    class="group flex items-start gap-3 p-4 rounded-lg border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-900/40 hover:border-primary-300 dark:hover:border-primary-700 hover:bg-primary-50/40 dark:hover:bg-primary-950/20 transition-colors">
    <span class="mt-0.5 flex-shrink-0 text-gray-400 dark:text-gray-500 group-hover:text-primary-500 dark:group-hover:text-primary-400 transition-colors">
      {{ if $hasChildren }}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h4l2 2h6a2 2 0 012 2v7a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
      </svg>
      {{ else }}
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h1m-4 12h12a2 2 0 002-2V8.414a1 1 0 00-.293-.707l-4.414-4.414A1 1 0 0014.586 3H5a2 2 0 00-2 2v13a2 2 0 002 2z" />
      </svg>
      {{ end }}
    </span>
    <span class="min-w-0">
      <span class="block font-sans font-semibold text-gray-900 dark:text-gray-100 group-hover:text-primary-700 dark:group-hover:text-primary-300 transition-colors truncate">
        {{ .LinkTitle }}
      </span>
      {{ with .Summary }}
      <span class="block text-sm text-gray-500 dark:text-gray-400 mt-0.5 line-clamp-2">{{ . | plainify | truncate 120 }}</span>
      {{ end }}
    </span>
  </a>
  {{ end }}
</div>
{{ else }}
<p class="text-gray-400 dark:text-gray-500 text-sm mt-4">Nothing here yet.</p>
{{ end }}
