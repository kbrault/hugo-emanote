{{ $palette := site.Params.primaryColor | default "blue" }}
{{ $levels := slice "50" "100" "200" "300" "400" "500" "600" "700" "800" "900" "950" }}

<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));

  @theme {
    --font-serif: 'Lora', ui-serif, Georgia, 'Times New Roman', serif;
    --font-sans: 'Mona Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Space Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    {{ range $levels }}
    --color-primary-{{ . }}: var(--color-{{ $palette }}-{{ . }});
    {{ end }}
  }
</style>
